name: LR Neo Daily Scrape

on:
  schedule:
    # GitHub Actions cron is UTC and does not support a timezone field.
    # The paired UTC hours cover both CET and CEST; the guard keeps only
    # 08:00-20:59 Europe/Belgrade. Two nearby attempts improve reliability.
    - cron: '17 6,7,12,13,18,19 * * *'
  workflow_dispatch:
    inputs:
      backfill_2026:
        description: 'Click back month-by-month and import all 2026 months down to January'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      username:
        description: 'Optional app username to scrape only one connected LR Neo account'
        required: false
        default: ''
      mode:
        description: 'Worker mode: snapshot or team_points'
        required: false
        default: 'snapshot'

permissions:
  contents: write

concurrency:
  group: lrneo-daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Belgrade refresh window
        id: refresh_window
        shell: bash
        run: |
          hour="$(TZ=Europe/Belgrade date +%H)"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || (( 10#$hour >= 8 && 10#$hour <= 20 )); then
            echo "run_worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            echo "Skip LR Neo scrape at ${hour}:00 Europe/Belgrade"
          fi

      - name: Install dependencies
        if: steps.refresh_window.outputs.run_worker == 'true'
        run: npm install

      - name: Install Chromium
        if: steps.refresh_window.outputs.run_worker == 'true'
        run: npx playwright install chromium --with-deps

      - name: Run LR Neo worker
        if: steps.refresh_window.outputs.run_worker == 'true'
        env:
          LRNEO_EMAIL: ${{ secrets.LRNEO_EMAIL }}
          LRNEO_PASSWORD: ${{ secrets.LRNEO_PASSWORD }}
          LR_APP_INGEST_URL: ${{ secrets.LR_APP_INGEST_URL }}
          LR_APP_INGEST_TOKEN: ${{ secrets.LR_APP_INGEST_TOKEN }}
          LR_APP_USERNAME: ${{ secrets.LR_APP_USERNAME }}
          LRNEO_HEADLESS: 'true'
          LRNEO_BACKFILL_2026: ${{ github.event.inputs.backfill_2026 || 'false' }}
          LRNEO_ONLY_USERNAME: ${{ github.event.inputs.username || '' }}
          LRNEO_MODE: ${{ github.event.inputs.mode || 'snapshot' }}
        run: |
          if [ "$LRNEO_MODE" = "team_points" ]; then
            node lrneo-team-points-worker.js
          else
            node lrneo-worker.js
          fi

      - name: Keep scheduled workflows active
        if: ${{ success() && github.event_name == 'schedule' && steps.refresh_window.outputs.run_worker == 'true' }}
        shell: bash
        run: |
          day="$(TZ=Europe/Belgrade date +%d)"
          hour="$(TZ=Europe/Belgrade date +%H)"
          if [ "$day" != "01" ] || [ "$hour" != "08" ]; then
            exit 0
          fi
          mkdir -p .github/health
          printf 'Last successful scheduled LR Neo refresh: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/health/last-scheduled-success.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/health/last-scheduled-success.txt
          git diff --cached --quiet || git commit -m 'chore: keep LR Neo schedules active'
          git push

      - name: Upload debug screenshot
        if: ${{ always() && steps.refresh_window.outputs.run_worker == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug-*.png
          if-no-files-found: ignore
