name: LR Neo Team Points

on:
  schedule:
    # Run after the main snapshot attempts and cover both CET and CEST.
    - cron: '47 6,7,12,13,18,19 * * *'
  workflow_dispatch:
    inputs:
      username:
        description: 'Optional app username to refresh one team; empty refreshes all connected users'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: lrneo-team-points
  cancel-in-progress: false

jobs:
  team-points:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Belgrade refresh window
        id: refresh_window
        shell: bash
        run: |
          hour="$(TZ=Europe/Belgrade date +%H)"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || (( 10#$hour >= 8 && 10#$hour <= 20 )); then
            echo "run_worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            echo "Skip LR Neo team points at ${hour}:00 Europe/Belgrade"
          fi

      - name: Install dependencies
        if: steps.refresh_window.outputs.run_worker == 'true'
        run: npm install

      - name: Install Chromium
        if: steps.refresh_window.outputs.run_worker == 'true'
        run: npx playwright install chromium --with-deps

      - name: Run LR Neo team points worker
        if: steps.refresh_window.outputs.run_worker == 'true'
        env:
          LR_APP_INGEST_URL: ${{ secrets.LR_APP_INGEST_URL }}
          LR_APP_INGEST_TOKEN: ${{ secrets.LR_APP_INGEST_TOKEN }}
          LRNEO_ONLY_USERNAME: ${{ github.event.inputs.username || '' }}
          LRNEO_HEADLESS: 'true'
        run: node lrneo-team-points-worker.js

      - name: Upload debug screenshots
        if: ${{ always() && steps.refresh_window.outputs.run_worker == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: team-points-debug
          path: debug-team-*.png
          if-no-files-found: ignore
