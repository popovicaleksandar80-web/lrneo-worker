name: LR Neo Team Points

on:
  schedule:
    # Run after the main snapshot job and avoid GitHub Actions peak minutes.
    - cron: '37 8,14,20 * * *'
      timezone: 'Europe/Belgrade'
  workflow_dispatch:
    inputs:
      username:
        description: 'Optional app username to refresh one team; empty refreshes all connected users'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: lrneo-team-points
  cancel-in-progress: false

jobs:
  team-points:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run LR Neo team points worker
        env:
          LR_APP_INGEST_URL: ${{ secrets.LR_APP_INGEST_URL }}
          LR_APP_INGEST_TOKEN: ${{ secrets.LR_APP_INGEST_TOKEN }}
          LRNEO_ONLY_USERNAME: ${{ github.event.inputs.username || '' }}
          LRNEO_HEADLESS: 'true'
        run: node lrneo-team-points-worker.js

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-points-debug
          path: debug-team-*.png
          if-no-files-found: ignore

